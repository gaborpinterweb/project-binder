# Project Binder — Fly.io (Commercial). Deploy locally: fly deploy
# Attach volume once: fly volumes create pb_data --region ams --size 3

app = "project-binder"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_COMMERCIAL = "true"
    # Lemon Squeezy (rebuild required when changing):
    VITE_LS_CHECKOUT_URL = "https://gaborpinter.lemonsqueezy.com/checkout/buy/d2765aee-0ba1-48a2-ba5e-ea9ea500eb5a"
    VITE_LS_PORTAL_URL = "https://gaborpinter.lemonsqueezy.com/billing"
# Runtime secret (not a build-arg): fly secrets set LEMONSQUEEZY_WEBHOOK_SECRET=…
# Webhook URL: https://cloud.projectbinder.app/api/ls-webhook

[env]
  PORT = "8090"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "pb_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
